name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-python-function:
    name: Test Python Function
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.14'

    - name: Install Python dependencies
      working-directory: functions/GreetingFunction
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python function tests
      working-directory: functions/GreetingFunction
      run: |
        python -m pytest test_function.py -v

    - name: Test function startup
      working-directory: functions/GreetingFunction
      run: |
        python -c "import main; print('Function imports successfully')"

    - name: Validate manifest.yml
      run: |
        pip install pyyaml
        python -c "import yaml; yaml.safe_load(open('manifest.yml'))"
        echo "manifest.yml is valid YAML"

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Setup Node.js
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
      with:
        node-version: 24.22.1

    - name: Install pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061  # v4.2.0
      with:
        version: 10

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      working-directory: ui/pages/foundryjs-demo
      run: pnpm install --frozen-lockfile

    - name: Run linter
      working-directory: ui/pages/foundryjs-demo
      run: pnpm run lint

    - name: Run tests
      working-directory: ui/pages/foundryjs-demo
      run: pnpm test

    - name: Build UI
      working-directory: ui/pages/foundryjs-demo
      run: pnpm run build

  code-lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
      - name: Run Validation
        id: trufflehog
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///workspace/ --branch HEAD \
            --config=.github/custom_detectors.yaml --no-verification \
            --exclude-paths=.github/detector-exclude-paths.txt \
            --results=verified,unknown,unverified --json --no-update --fail \
            > trufflehog-results.json 2>/dev/null
        continue-on-error: true
      - name: Validation summary
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Detector | File | Line | Commit |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          jq -r 'select(.SourceMetadata) | "\(if .DetectorName == "CustomRegex" then (.ExtraData.name // "CustomRegex") else .DetectorName end) | \(.SourceMetadata.Data.Git.file) | L\(.SourceMetadata.Data.Git.line) | \(.SourceMetadata.Data.Git.commit)"' trufflehog-results.json | sort -u | awk '{printf "| %d | %s |\n", NR, $0}' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validation findings - failing build." >> $GITHUB_STEP_SUMMARY
      - name: Fail on validation findings
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
